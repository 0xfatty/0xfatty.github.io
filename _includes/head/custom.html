<!-- start custom head snippets -->

<!-- Site is dark-skin only (minimal_mistakes_skin: dark) — tell the browser so
     native UI (form controls, scrollbars, mobile address bar) matches instead
     of defaulting to light, and there's no light-mode flash before CSS loads. -->
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#252a34">

<!-- Favicons (the theme emits none by default). -->
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon.png' | relative_url }}">

<!-- Long unbroken strings (bare URLs, hashes, onion addresses, wallets) otherwise widen the page on phones. -->
<style>
  .page__content { overflow-wrap: break-word; }
  .page__content :not(pre) > code { overflow-wrap: anywhere; }
</style>

<!-- Explicit preview-image dimensions. LinkedIn/Facebook use these to decide an image
     qualifies for a large link card without downloading it first; without them the
     scraper often falls back to a small thumbnail. Declared per-post in front matter. -->
{% if page.header.og_image_width and page.header.og_image_height %}
<meta property="og:image:width" content="{{ page.header.og_image_width }}">
<meta property="og:image:height" content="{{ page.header.og_image_height }}">
<meta property="og:image:type" content="{{ page.header.og_image_type | default: 'image/jpeg' }}">
{% endif %}
<!-- end custom head snippets -->
