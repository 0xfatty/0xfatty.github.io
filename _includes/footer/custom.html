<!-- start custom footer snippets -->
{% if page.mermaid %}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

  // ```mermaid fences come out as div.language-mermaid or pre > code.language-mermaid depending on the
  // kramdown/rouge versions (local vs GitHub Pages); swap either for the element mermaid renders.
  // Render into a div, not a pre: the theme's pre styles cascade into mermaid's labels and collapse them.
  document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid").forEach((node) => {
    const block = node.closest("div.language-mermaid") || node.closest("pre");
    if (!block.isConnected) return;
    const wrap = document.createElement("div");
    wrap.style.cssText = "overflow-x:auto;margin:1.5em 0;";
    const diagram = document.createElement("div");
    diagram.className = "mermaid";
    diagram.style.cssText = "min-width:900px;";
    diagram.textContent = (block.querySelector("code") || block).textContent;
    wrap.appendChild(diagram);
    const hint = document.createElement("p");
    hint.style.cssText = "font-size:0.75em;font-style:italic;opacity:0.7;margin:0 0 0.5em;";
    hint.textContent = "Diagram is wider than the page — scroll sideways to see all of it.";
    block.replaceWith(hint, wrap);
  });

  mermaid.initialize({
    startOnLoad: false,
    theme: "dark",
    securityLevel: "strict",
    flowchart: { htmlLabels: false },
  });
  await mermaid.run({ querySelector: "div.mermaid" });
</script>
{% endif %}
<!-- end custom footer snippets -->
