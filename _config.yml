# Site settings
repository               : 0xfatty/0xfatty.github.io
locale                   : "en-US"
title                    : "iam.chi"
title_separator          : "|"
name                     : "Chi Tran"
email                    : research@ctrsec.io
description              : >-
  Security research and writeups by Chi Tran. Words are my own.
baseurl                  : ""
url                      : "https://0xfatty.github.io"
destination              : ./docs

# Theme
remote_theme             : "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin    : "dark"

# Social / SEO
twitter:
  username               : imspicynoodles
og_image                 : "/images/site-preview.png"
social:
  type                   : Person
  name                   : "Chi Tran"
  links:
    - "https://twitter.com/imspicynoodles"
    - "https://www.linkedin.com/in/iam-trchi/"
    - "https://github.com/0xfatty"
    - "https://ctrsec.io"

# Build settings
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-remote-theme

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

# The remote theme's own Sass (main.scss entry point plus bundled susy/breakpoint
# vendor code) uses syntax Dart Sass is deprecating (@import, slash division,
# red()/green()/blue()). quiet_deps silences dependency warnings; silence_deprecations
# additionally covers the @import warning from the theme's own entry stylesheet.
sass:
  quiet_deps: true
  silence_deprecations: ["import"]

permalink: /:categories/:title/
timezone: America/New_York
future: false

# Search
search                   : true
search_full_content      : true

# Pagination
paginate                 : 10
paginate_path            : /page:num/

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Reading Files
include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - docs

# Site Author
author:
  name             : "Chi Tran"
  avatar           : "/images/bio-photo.jpg"
  bio              : >-
    Senior Security Researcher, dad of two, and a former line cook who never
    stopped loving spicy noodles. I write up the vulnerabilities and other
    rabbit holes I stumble into.


    *Opinions and research here are my own — not my employer's, past or present.*
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:research@ctrsec.io"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/iam-trchi/"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/imspicynoodles"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/0xfatty"
    - label: "Resume"
      icon: "fas fa-fw fa-file-pdf"
      url: "/files/Chi_Tran_Resume.pdf"
    - label: "Homepage"
      icon: "fas fa-fw fa-home"
      url: "https://ctrsec.io"

# Footer
footer:
  links:
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/imspicynoodles"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/0xfatty"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/iam-trchi/"

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      show_date: true
      toc: true
      toc_sticky: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false