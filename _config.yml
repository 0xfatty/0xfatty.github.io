# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

repository: 0xfatty/0xfatty.github.io

title: iam.chi
email: research@ctrsec.io
description: >- # this means to ignore newlines until "baseurl:"
  Security Research | Writeups | Words are my own.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://0xfatty.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: imspciynoodles
github_username:  0xfatty
destination: ./docs

# Build settings
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-feed
  - jekyll-include-cache

search: true

# Reading Files
include:
  - _pages

categories_path: categories.html
about_path: about.html

# Site Author
author:
  name             : "Chi Tran"
  avatar           : "/images/bio-photo.jpg"
  bio              : "Hey! I am Chi &#124; Father of 2 &#124; Security Engineer &#124; I love cooking and spicy noodles."
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:research@ctrsec.io"
    - label: "Linkedin"
      icon: "fas fa-fw fa-link"
      url: "https://www.linkedin.com/in/remote-code-execution/"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/imspciynoodles"
    - label: "Homepage"
      icon: "fas fa-fw fa-link"
      url: "https://ctrsec.io"

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/